name: MFA user journeys video

# Records the MFA user journeys at human pace, so that the support team can
# watch the screens shown to end users.

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANNUAIRE_SERVICE_PUBLIC_API_URL: http://localhost:3000/___testing___/api-lannuaire.service-public.fr
  CYPRESS_RECORD: true
  CYPRESS_RECORD_FOR_HUMANS: true
  DATABASE_URL: postgres://proconnect-identite:proconnect-identite@localhost:5432/proconnect-identite
  ENTREPRISE_API_URL: http://localhost:3000/___testing___/entreprise.api.gouv.fr
  FRANCECONNECT_ISSUER: http://localhost:3000/___testing___/oidc.franceconnect.gouv.fr/api/v2
  RNE_API_BASE_URL: http://localhost:3000/___testing___/registre-national-entreprises.inpi.fr
  SMTP_URL: smtp://localhost:1025

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose up --build --detach

      - uses: actions/setup-node@v7
        with:
          cache: "npm"
          node-version-file: package.json
      - run: npm ci
        env:
          NPM_CONFIG_AUDIT: false
          NPM_CONFIG_FUND: false
          NPM_CONFIG_UPDATE_NOTIFIER: false
      - run: npm run build:workspaces
      - run: npm run migrate up
      - name: Cypress run
        uses: cypress-io/github-action@v7.4.10
        with:
          wait-on: http://localhost:3000/users/start-sign-in
          build: npm run build:assets
          start: npx dotenvx run -f cypress/e2e/mfa_user_journeys/env.conf --overload -- npm run start
          install: false
          spec: cypress/e2e/mfa_user_journeys/index.cy.ts
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mfa-user-journeys-video
          path: cypress/videos
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mfa-user-journeys-screenshots
          path: cypress/screenshots
