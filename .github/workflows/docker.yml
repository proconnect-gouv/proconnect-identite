name: 🐋 Docker

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: 🥧 Bake Image
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Cache npm
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: root-npm
          key: docker-npm-${{ hashFiles('package-lock.json') }}

      - name: Persist npm cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "root-npm": "/root/.npm"
            }
          skip-extraction: ${{ steps.npm-cache.outputs.cache-hit }}

      - name: Build
        uses: docker/bake-action@master
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          SOURCE_COMMIT: ${{ github.sha }}

  integration_test:
    name: 🚥 Integration test
    needs:
      - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: 🚥 Run Container Tests
        uses: docker://gcr.io/gcp-runtimes/container-structure-test:v1.15.0
        with:
          args: test --config container-structure-test.yml --image ghcr.io/${{ github.repository }}:${{ github.sha }} --verbosity debug
