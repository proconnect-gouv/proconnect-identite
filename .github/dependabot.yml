---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    labels:
      - dependencies
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    groups:
      sentry:
        patterns:
          - "@sentry/*"
      maildev:
        patterns:
          - "*maildev*"
    labels:
      - dependencies
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@simplewebauthn/server"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@simplewebauthn/browser"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@simplewebauthn/types"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@simplewebauthn/typescript-types"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # SDK 11 requires self-hosted Sentry >= 26.4.2; we run 24.8.0 (the 10.x line is supported against >= 24.4.2).
      # https://docs.sentry.io/platforms/javascript/migration/v10-to-v11/
      - dependency-name: "@sentry/*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "docker"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    labels:
      - dependencies
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: postgres
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "docker-compose"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    groups:
      maildev:
        patterns:
          - "*maildev*"
    labels:
      - dependencies
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: postgres
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: redis
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
